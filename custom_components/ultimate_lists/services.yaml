create_list:
  name: Create list
  description: Create a new Ultimate Lists list.
  fields:
    title:
      required: true
      selector:
        text:
    type:
      selector:
        select:
          options:
            - dynamic
            - static
            - template
            - hybrid
    icon:
      selector:
        icon: {}
    color:
      selector:
        text: {}
    sort_mode:
      selector:
        select:
          options:
            - manual
            - unchecked_first
            - sectioned
            - priority

rename_list:
  name: Rename list
  description: Rename an existing list.
  fields:
    list_id:
      required: true
      selector:
        text: {}
    title:
      required: true
      selector:
        text: {}

delete_list:
  name: Delete list
  description: Delete a list.
  fields:
    list_id:
      required: true
      selector:
        text: {}

archive_list:
  name: Archive list
  description: Archive or restore a list.
  fields:
    list_id:
      required: true
      selector:
        text: {}
    archived:
      selector:
        boolean: {}

duplicate_list:
  name: Duplicate list
  description: Duplicate a list.
  fields:
